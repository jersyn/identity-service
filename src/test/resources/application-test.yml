spring:
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

  jooq:
    sql-dialect: POSTGRES

server:
  port: 0

jwt:
  signing:
    private-key: 
    public-key: 
    kid: test-key-id
  access-token:
    issuer: identity-service-test
    audience: identity-service-test
    lifetime: PT15M

logging:
  level:
    com.identity: DEBUG
    org.testcontainers: INFO
    org.springframework: WARN
