spring:
  application:
    name: identity-service
  config:
    import: optional:file:.env[.properties]

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

  jooq:
    sql-dialect: POSTGRES

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:16379}
      password: ${REDIS_PASSWORD}

server:
  port: ${SERVER_PORT:8080}

jwt:
  signing:
    private-key: ${JWT_SIGNING_PRIVATE_KEY}
    public-key: ${JWT_SIGNING_PUBLIC_KEY}
    kid: ${JWT_SIGNING_KID:identity-service-key-1}
  access-token:
    issuer: identity-service
    audience: ${JWT_ACCESS_TOKEN_AUDIENCE}
    lifetime: PT15M

logging:
  level:
    com.identity: ${LOG_LEVEL:INFO}
    org.springframework.security: ${LOG_SECURITY_LEVEL:WARN}
